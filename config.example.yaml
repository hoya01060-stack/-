# 이 파일을 config.yaml 로 복사해서 수정하세요.  (cp config.example.yaml config.yaml)
# 모든 % 값은 "퍼센트 숫자"입니다. 예) 20 = 20%

markets: [KR, US]

# 동일비중 매수 금액 계산용 (기법 4: 미하일 포페)
capital:
  KR: 10000000      # 원
  US: 10000         # 달러
max_positions: 10   # 총자산 / max_positions = 1종목 매수금액

universe:
  KR:
    markets: [KOSPI, KOSDAQ]
    min_price: 1000            # 원
    min_avg_value: 1000000000  # 20일 평균 거래대금 10억원 이상
    exclude_preferred: true    # 우선주 제외
    exclude_spac: true         # 스팩 제외
  US:
    source: SP500              # SP500 (기본) | NASDAQ | NYSE  (NASDAQ/NYSE는 종목 수가 많아 느림)
    extra_tickers: []          # 추가로 감시할 티커 예) [PLTR, SOFI]
    min_price: 5
    min_avg_value: 20000000    # 20일 평균 거래대금 2천만 달러 이상

strategies:
  # 1-1 거래량 급감 (빈로드 코슬라)
  volume_dryup:
    enabled: true
    drawdown_pct: 20       # 고점 대비 하락률
    high_lookback: 120     # 고점 산정 기간(거래일)
    decline_days: 5        # 거래량 연속 감소 일수
  # 1-2 가격 방어 (제이 아우타니)
  price_defense:
    enabled: true
    window: 20             # 관찰 기간
    band_pct: 2            # 지지선 +2% 이내 저가 = 지지선 테스트
    min_tests: 3           # 최소 테스트 횟수
    min_hold_days: 10      # 지지선이 버틴 최소 기간
    max_above_pct: 8       # 현재가가 지지선 +8% 이내일 때만 (매수 가능 구간)
    vol_mult: 1.3          # 테스트일 거래량 >= 60일 평균 x1.3 (매도 물량 출회)
    recent_test_days: 5    # 최근 5일 안에 다시 테스트
  # 1-3 거래량 폭증 + 주가 횡보 (데이비드 시겔)
  volume_surge_sideways:
    enabled: true
    window: 20             # 최근 한 달(20거래일)
    base: 60               # 비교 기준: 그 이전 60거래일 평균
    vol_mult: 3            # 거래량 3배 이상
    max_move_pct: 3        # 한 달 주가 변동 3% 미만
  # 2-1 폭락장의 버팀목 (올리버 켈)
  leaders:
    enabled: true
    crash_drawdown_pct: 8  # 지수가 60일 고점 대비 8% 이상 하락 = 폭락장 모드
    lookback: 60
    down_day_pct: -1.0     # 지수 하락일 기준 (-1% 이하)
    min_down_days: 3
    top_n: 20
  # 2-2 10일 이동평균선 매매 (올리버 켈)
  ma10:
    enabled: true
    period: 10
  # 2-3 돌파 매매 + 불타기 (데이비드 헨)
  breakout:
    enabled: true
    surge_pct: 20          # 직전 급등 폭
    surge_window: 10       # 급등 측정 기간(거래일)
    min_rest: 2            # 횡보 2~3일
    max_rest: 3
    max_pullback_pct: 8    # 횡보 중 고점 대비 최대 눌림
    pyramid_levels_pct: [5, 10]   # 매수가 대비 +5%, +10% 에서 불타기 알림
  # 2-4 20일 신고가 돌파 매수 / 10일 신저가 이탈 매도 (터틀 방식)
  donchian:
    enabled: true
    entry_period: 20       # 최근 20일 최고가를 뚫으면 매수
    exit_period: 10        # 최근 10일 최저가를 깨면 전량 매도
    near_pct: 3            # 20일 최고가 3% 이내 종목을 장중 감시
    near_watch_max: 60     # 그중 최대 감시 종목 수
  # 2-5 하루 +20% 급등 주도주 → 3일간 차익매물에도 상승분 절반 지지 → 매수
  surge_hold:
    enabled: true
    surge_pct: 20          # 하루 상승률
    surge_vol_mult: 2.0    # 급등일 거래량 >= 직전 20일 평균 x2 (주도주 조건)
    hold_days: 3           # 지지 확인 기간
    hold_ratio: 0.5        # 상승분의 절반 (급등 전일 종가 + 상승폭 x 0.5)
    basis: low             # low: 장중 저가도 지지선 위 (엄격) | close: 종가만 지지선 위
    require_pullback: true # 3일 중 급등일 종가 아래로 밀린 적 있어야 함 (= 차익 매물 출회)
    rest_vol_mult: 1.0     # 3일 평균 거래량 >= 급등 전 평균 x1 (매물이 실제로 나옴)
    alert_before_close_min: 30   # 3일째 장 마감 30분 전부터 지지 유지 중이면 '종가 매수' 알림
  # 2-6 24개월 박스권 + 세력 매집 → 박스 상단 돌파 매수 (계좌 10~20%), 돌파 실패 시 계좌 1~2% 손실선 손절
  box:
    enabled: true
    lookback: 480            # 약 24개월(거래일)
    max_range_pct: 50        # 24개월 종가 최고/최저 폭 50% 이내 = 박스권
    max_net_change_pct: 15   # 24개월 전 대비 현재 등락 15% 이내 = 오르지도 내리지도 않음
    accum_window: 120        # 최근 6개월 거래량 패턴 확인
    min_ratio: 1.3           # 오른 날 평균 거래량 / 내린 날 평균 거래량 >= 1.3 (세력 매집)
    strong_ratio: 2.0        # 이 이상이면 최대 비중
    weight_min_pct: 10       # 계좌 대비 매수 비중 (매집 강도에 따라 10% ~ 20%)
    weight_max_pct: 20
    fail_buffer_pct: 3       # 박스 상단 -3% 아래로 다시 빠지면 '돌파 실패' → 즉시 손절
    max_account_loss_pct: 2  # 손절 시 계좌 손실이 이 값을 넘지 않게 수량/손절가 조정 (1~2%)
    near_pct: 10             # 박스 상단 10% 이내 종목을 장중 감시
    near_watch_max: 40
  # 2-7 주도주 눌림: 거래량 폭발 급등 → 거래량 급감 조정에도 가격 방어 → 거래량 붙으며 이전 고점 돌파 매수
  pullback:
    enabled: true
    surge_window: 15        # 급등 측정 기간(거래일)
    surge_pct: 30           # 그 기간 상승률 (크게 상승한 주도주)
    surge_vol_mult: 3.0     # 급등 구간 최대 거래량 >= 급등 전 50일 평균 x3 (거래량 폭발)
    vol_base: 50
    lookback: 60            # 고점 탐색 기간
    min_pullback_days: 5    # 최소 조정 기간
    dry_ratio: 0.5          # 조정 기간 평균 거래량 <= 급등 구간 평균 x0.5 (거래량 급감)
    max_retrace: 0.5        # 상승분의 50% 이상 되돌리면 '방어 실패'
    max_drawdown_pct: 25    # 고점 대비 -25% 이상 빠지면 '방어 실패'
    breakout_vol_mult: 1.5  # 돌파일 거래량 >= 최근 50일 평균 x1.5 (거래량이 다시 붙음)
    min_close_strength: 0.5 # 종가가 당일 (고가-저가) 범위 상단 50% 이상 (강하게 뚫음)
  # 2-8 8~10주 횡보 박스권 → 거래량 3배 동반 상단 돌파 매수 → 돌파 가격 이탈 시 즉시 손절
  base:
    enabled: true
    min_len: 40             # 8주(거래일) 이상 횡보
    max_len: 50             # 10주까지 횡보 기간 표시
    max_range_pct: 15       # 기간 중 종가 최고/최저 폭 15% 이내 = 크게 오르거나 내리지 않음
    vol_base: 50            # 평소 거래량 = 직전 50일 평균
    vol_mult: 3.0           # 돌파일 거래량 >= 평소 x3
    min_close_strength: 0.5 # 종가가 당일 범위 상단 50% 이상 (강하게 뚫음)
    near_pct: 5             # 박스 상단 5% 이내 종목 장중 감시
    near_watch_max: 40
  # 3 사이클 주식 바닥 (마취과 의사) - 주 1회 재무데이터 갱신
  cycle:
    enabled: true
    max_psr: 0.5           # 시가총액 / 연매출
    loss_years: 2          # 적자 연속 연수 (2 = 적자 2년차)
    strict_second_year: true   # true: 정확히 2년차(3년 전은 흑자)만
    loss_metric: operating     # operating(영업이익) | net(순이익)
    min_peer_loss_ratio: 0.5   # 같은 업종 경쟁사 중 적자 비율 50% 이상
    min_peers: 3
    target_eps_multiple: 5     # 목표가 = 과거 최고 EPS x 5
    history_years: 8

risk:
  stop_loss_pct: 5       # 기법 4: -5% 손절
  take_profit_pct: 15    # 기법 4: +15% 익절
  account_risk_pct: 2    # 한 종목에서 계좌의 2%를 넘게 잃기 전에 무조건 손절 (모든 매수에 적용)
  default_exit_mode: fixed   # fixed(-5/+15) | trend(10일선 이탈 매도 + 불타기) | turtle(10일 최저가 이탈 전량 매도) | cycle

regime:
  # 기법 4-2: 하락장 자산 방어 (레이 달리오)
  crash_drawdown_pct: 15   # 지수 52주 고점 대비 -15% → 위험회피
  suppress_buys_in_risk_off: false   # true면 위험회피 국면에서 매수 알림 중단
  safe_assets:
    KR: {"132030": "KODEX 골드선물(H)", "261240": "KODEX 미국달러선물"}
    US: {"GLD": "SPDR Gold", "UUP": "Invesco DB US Dollar Bullish"}

intraday:
  interval_min: 5
  provider: auto          # auto(KIS 키 있으면 KIS, 없으면 yfinance) | kis | yfinance
  max_watch: 150          # 시장별 장중 감시 최대 종목 수 (API 호출 제한 고려)
  kis_requests_per_sec: 8

schedule:
  KR: {scan_time: "16:10", intraday_start: "09:05", intraday_end: "15:20"}
  US: {scan_time: "16:30", intraday_start: "09:35", intraday_end: "15:55"}
  fundamentals: {day_of_week: sat, time: "10:00"}   # 한국시간

briefing:
  use_llm: true           # ANTHROPIC_API_KEY 가 있을 때만 동작
  model: claude-opus-5-5

data_dir: data
history_days: 800         # 일봉 보관 기간 (24개월 박스권 계산에 약 2년 이상 필요)
